---
layout: default
title: Home
---

<main class = "main-content">
    <section class = "bigger-side">
        <section class = "text-tiles small-tile">
            {% assign post = site.posts.first %}
                <h3 class = "section-heading">$ query article --newest</h3>
                <h2><i>{{ post.title }}</i></h2>
                <p>
                    {{ post.excerpt }}
                </p>
                <a href="{{ site.baseurl }}{{ post.url }}" class="nav-link"><br/>
                    Continue reading
                </a>
        </section>
        <section class="text-tiles small-tile about-me-tab">
            <img src="{{ site.baseurl }}/assets/img/pfp.jpeg" alt="my profile picture" class = "pfp"/>
            <section class = "about-me">
                <h2 class = "section-heading">$ whoami </h2>
                <p>
                   <b>wizarddos</b> - Cybersecurity resarcher, sofware developer and malware analyst <br/><br/>
                   <a href="/" class = "nav-link">Tell me more!</a>
                </p>
            </section>
        </section>
    </section>
    <section class = "smaller-side text-tiles big-tile">
        <h2 class = "section-heading">$ query article all  </h2>
    </section>
</main>
